name: Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python
        run: python -m py_compile app/app.py

      - name: Validate shell scripts
        run: |
          bash -n install-lxc.sh
          bash -n install-app.sh
          bash -n update-lxc.sh

      - name: Verify required files
        run: |
          test -f install-lxc.sh
          test -f install-app.sh
          test -f update-lxc.sh
          test -f requirements.txt
          test -f VERSION
