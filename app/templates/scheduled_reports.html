{% extends "base.html" %}{% block title %}Scheduled Reports{% endblock %}{% block content %}<h1>Scheduled Reports</h1><form class="panel" method="post"><input name="name" placeholder="Rapportnamn" required><select name="project_id"><option value="">Portfolio</option>{% for p in projects %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select><select name="format"><option>pdf</option><option>pptx</option></select><select name="cadence"><option>weekly</option><option>monthly</option></select><input name="recipient" placeholder="Recipient/email"><button>Spara</button></form><div class="panel"><table class="compact-table">{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.format}}</td><td>{{r.cadence}}</td><td>{{r.recipient}}</td></tr>{% endfor %}</table></div>{% endblock %}
