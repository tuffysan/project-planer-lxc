{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>Tidrapportering · {{project.name}}</h1><p>Totalt {{total}} timmar.</p></div></div><section class="card"><form method="post" class="form-grid two"><input type="hidden" name="_csrf" value="{{csrf_token}}"><label>Aktivitet<select name="task_id"><option value="">Projektet</option>{% for t in tasks %}<option value="{{t.id}}">{{t.wbs}} {{t.title}}</option>{% endfor %}</select></label><label>Datum<input type="date" name="work_date"></label><label>Timmar<input type="number" step="0.25" min="0.25" name="hours" required></label><label>Kommentar<input name="note"></label><button class="primary">Rapportera</button></form></section><section class="card"><table><thead><tr><th>Datum</th><th>Person</th><th>Aktivitet</th><th>Timmar</th><th>Kommentar</th></tr></thead><tbody>{% for e in entries %}<tr><td>{{e.work_date}}</td><td>{{e.display_name}}</td><td>{{e.task_title or 'Projekt'}}</td><td>{{e.hours}}</td><td>{{e.note}}</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
