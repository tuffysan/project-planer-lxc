{% extends "base.html" %}{% block title %}Sök{% endblock %}{% block content %}<h1>Global sökning</h1><form><input class="command-box" name="q" value="{{q}}" autofocus><button>Sök</button></form><div class="panel">{% for r in results %}<p><span class="badge">{{r.type}}</span> <a href="{{r.url}}"><b>{{r.label}}</b></a><br><small>{{r.detail}}</small></p>{% else %}<p>Inga träffar.</p>{% endfor %}</div>{% endblock %}
