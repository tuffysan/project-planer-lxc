{% extends "base.html" %}{% block title %}Trash{% endblock %}{% block content %}<h1>Project Trash</h1><table class="compact-table">{% for p in rows %}<tr><td>{{p.name}}</td><td>{{p.deleted_at}}</td><td><form method="post" action="{{url_for('admin_trash_restore',project_id=p.id)}}"><button>Restore</button></form></td></tr>{% else %}<tr><td>Trash is empty.</td></tr>{% endfor %}</table>{% endblock %}
