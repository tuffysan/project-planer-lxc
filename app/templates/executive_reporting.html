{% extends "base.html" %}{% block title %}Executive Reporting{% endblock %}{% block content %}<h1>Executive Reporting</h1><div class="panel"><table class="compact-table"><tr><th>Projekt</th><th>RAG</th><th>Progress</th><th>Overdue</th><th>Risk</th><th>Export</th></tr>{% for x in rows %}<tr><td>{{x.p.name}}</td><td><span class="badge {{x.rag}}">{{x.rag}}</span></td><td>{{x.s.progress}}%</td><td>{{x.s.overdue|length}}</td><td>{{x.s.high|length}}</td><td><a href="{{url_for('project_report_pdf',project_id=x.p.id)}}">PDF</a> · <a href="{{url_for('project_report_pptx',project_id=x.p.id)}}">PowerPoint</a></td></tr>{% endfor %}</table></div>{% endblock %}
