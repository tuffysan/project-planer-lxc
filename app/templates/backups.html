{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>Backups</h1></div></div><section class="card"><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token}}"><button class="primary">Skapa backup nu</button></form>{% for f in files %}<div class="list-row"><div><strong>{{f.name}}</strong><small>{{f.size}} bytes</small></div><a href="{{url_for('download_backup',name=f.name)}}">Hämta</a></div>{% endfor %}</section>{% endblock %}
