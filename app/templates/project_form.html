{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>{{"Redigera projekt" if project else "Nytt projekt"}}</h1></div></div>
<form method="post" class="card form-grid two"><input type="hidden" name="_csrf" value="{{csrf_token}}">
<label>Projektnamn<input name="name" required value="{{project.name if project else ''}}"></label><label>Kund<input name="customer" value="{{project.customer if project else ''}}"></label>
<label>Projektledare<input name="project_manager" value="{{project.project_manager if project else ''}}"></label>
{% if not project %}<label>Mall<select name="template_name"><option value="">Tomt projekt</option>{% for t in templates %}<option>{{t.name}}</option>{% endfor %}</select></label>{% endif %}
<label>Startdatum<input type="date" name="start_date" value="{{project.start_date if project else ''}}"></label><label>Slutdatum<input type="date" name="end_date" value="{{project.end_date if project else ''}}"></label>
<label class="full">Beskrivning<textarea name="description" rows="5">{{project.description if project else ''}}</textarea></label>
<div class="full actions"><button class="primary">Spara</button><a class="button" href="{{url_for('project',project_id=project.id) if project else url_for('index')}}">Avbryt</a></div></form>{% endblock %}
