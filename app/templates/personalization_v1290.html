{% extends "base.html" %}{% block title %}Personalisering{% endblock %}{% block content %}<div class="simple-shell">
<section class="simple-hero"><div class="eyebrow">v12.9</div><h1>Mina favoriter</h1><p>Favoriter och personlig startupplevelse utan att göra systemet mer komplicerat.</p></section>
<div class="simple-grid">{% for p in projects %}<section class="simple-card"><h3>{{p.name}}</h3><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token}}"><input type="hidden" name="project_id" value="{{p.id}}"><input type="hidden" name="action" value="{{'remove' if p.favorite else 'favorite'}}"><button>{{'★ Ta bort favorit' if p.favorite else '☆ Lägg till favorit'}}</button></form></section>{% endfor %}</div></div>{% endblock %}
