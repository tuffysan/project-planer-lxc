<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Projektplan{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="brand" href="{{ url_for('index') }}">Projektplan</a>
    <div class="nav-actions">
      <a class="btn ghost" href="{{ url_for('export_all') }}">Exportera alla till Excel</a>
      <a class="btn" href="{{ url_for('new_project') }}">+ Nytt projekt</a>
    </div>
  </div>
</header>
<main class="wrap">
{% with messages = get_flashed_messages() %}
  {% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}
{% endwith %}
{% block content %}{% endblock %}
</main>
</body>
</html>
