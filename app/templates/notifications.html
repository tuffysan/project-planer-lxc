{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>Notiser</h1></div></div><section class="card">{% for n in items %}<div class="list-row"><div><strong>{{n.message}}</strong><small>{{n.created_at}}</small></div>{% if n.link %}<a class="button" href="{{n.link}}">Öppna</a>{% endif %}</div>{% else %}<div class="empty">Inga notiser.</div>{% endfor %}</section>{% endblock %}
