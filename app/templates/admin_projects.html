{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>Alla projekt</h1><p>Administratören kan se och hantera alla projekt.</p></div><a class="button" href="{{url_for('admin_center')}}">Admin Center</a></div>
<section class="card"><div class="table-wrap"><table><thead><tr><th>Projekt</th><th>Kund</th><th>Projektledare</th><th>Medlemmar</th><th></th></tr></thead><tbody>{% for p in projects %}
<tr><td><a href="{{url_for('project',project_id=p.id)}}">{{p.name}}</a></td><td>{{p.customer}}</td><td>{{p.project_manager}}</td><td>{{p.member_count}}</td><td><form method="post" action="{{url_for('admin_delete_project',project_id=p.id)}}" onsubmit="return confirm('Ta bort projektet permanent?')"><input type="hidden" name="_csrf" value="{{csrf_token}}"><button class="danger-button">Ta bort</button></form></td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
